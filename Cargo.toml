[package]
name = "bertbox"
version = "0.1.0-dev"
edition = "2024"

[dependencies]
aes = "0.9"
anstream = "1"
anyhow = "1"
ast-grep = "0.51"
ast-grep-config = "0.51"
ast-grep-core = "0.51"
ast-grep-language = { version = "0.51", default-features = false, features = ["tree-sitter-rust"] }
base64 = "0.23"
bat = { version = "0.26", default-features = false, features = ["regex-fancy"] }
chardetng = "1"
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
crc32fast = "1"
crossterm = "0.29"
ctr = "0.10"
digest-io = "0.1"
dns-lookup = "4"
dotenvy = "0.15"
etcetera = "0.11"
flate2 = "1"
glob = "0.3"
hex = "0.4"
ignore = "0.4"
imagesize = "0.15"
indicatif = "0.18"
infer = "0.22"
ipnet = "2"
jiff = "0.2"
libc = "0.2"
linkify = "0.11"
lofty = "0.25"
mailparse = "0.18"
md-5 = "0.11"
minijinja = "3"
mozjpeg-sys = { version = "2", default-features = false, features = ["parallel", "unwinding"] }
nix = { version = "0.31", features = ["fs", "signal", "user"] }
nucleo-matcher = "0.3"
num_cpus = "1"
percent-encoding = "2"
prettyplease = { version = "0.3", features = ["verbatim"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
qrcode = { version = "0.14", default-features = false }
quote = "1"
rand = "0.10"
rayon = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rpassword = "7"
ruff_python_ast = "=0.0.20"
ruff_python_formatter = "=0.0.20"
ruff_python_parser = "=0.0.20"
ruff_source_file = "=0.0.20"
ruff_text_size = "=0.0.20"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
signal-hook = "0.4"
similar = "3"
socket2 = "0.6"
syn = { version = "3", features = ["full", "visit", "visit-mut"] }
syn-serde3 = "0.0.1"
tempfile = "3"
uncomment = "=3.10.3"
unicode-normalization = "0.1"
url = "2"
walkdir = "2"
winnow = "1"
zbus = "6"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
vergen-gix = { version = "10", features = ["emit_and_set"] }

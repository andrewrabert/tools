[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"

[workspace.dependencies]
base64 = "0.23"
bertbox-forgejo = { path = "crates/forgejo" }
bertbox-http = { path = "crates/http" }
bertbox-immich = { path = "crates/immich" }
bertbox-jdownloader = { path = "crates/jdownloader" }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2"
url = "2"
webpki-root-certs = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package.zopfli]
opt-level = 3
